name: Build OCCT

on:
  push:
    branches: [main]
  # PRs are gated. Without this the repo had NO automatic validation at all:
  # the workflow only ran on pushes to main and on manual dispatch, so whether
  # a pull request had ever been built depended on someone remembering to fire
  # one by hand. Mirrors farfield-ru/libvsg-build, which had the identical gap.
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per ref. Six lanes building OCCT from source is by far the
# costliest thing this repo does — and with no timeout-minutes set, each lane
# inherits GitHub's 6-hour default — so a PR pushed three times would otherwise
# stack 18 of them.
#
# cancel-in-progress is deliberately PR-ONLY. A push to main does not just
# build: its `release` job re-uploads all six assets with --clobber, and
# cancelling that midway leaves the release holding a MIX of old and new
# archives under an unchanged tag. Consumers pin by per-asset SHA256
# (modeuler-ng's cmake/FetchOCCT.cmake does), so that surfaces as a hash
# mismatch on some platforms and not others, with nothing naming the cause.
# PR runs are disposable; publishing runs must finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OCCT_TAG: V8_0_0_p1

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug, RelWithDebInfo]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build.sh ${{ matrix.build_type }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 -BuildType ${{ matrix.build_type }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: occt-${{ env.OCCT_TAG }}-${{ runner.os == 'Windows' && 'windows' || 'linux' }}-x64-${{ matrix.build_type }}
          path: _work/dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="occt-${OCCT_TAG}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "OCCT ${OCCT_TAG} shared libraries" \
              --notes "OpenCASCADE ${OCCT_TAG} built as shared libraries for Linux (x64) and Windows (x64, MSVC) in Release, Debug and RelWithDebInfo configurations. Modules: FoundationClasses, ModelingData, ModelingAlgorithms, DataExchange, ApplicationFramework, Visualization (headless). All USE_* options disabled."
          gh release upload "$TAG" dist/* --clobber
